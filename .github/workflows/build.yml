name: Build Windows EXE

# 触发条件：push 到 main、手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成应用图标
        shell: pwsh
        run: python assets/icons/generate_icon.py

      - name: 构建 EXE
        shell: pwsh
        run: |
          # 用 UTF-8 编码，确保中文文件名/输出正确
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          pyinstaller build.spec --noconfirm --clean

      - name: 重命名产物并打包
        shell: pwsh
        run: |
          # 把 exe 单独放进一个目录，方便作为 artifact 上传
          $out = "artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # exe 文件名是中文，dist 下只有一个 exe
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "$out\$($exe.Name)"
          # 附带版本信息
          "Build: ${{ github.run_id }}" | Out-File "$out\build-info.txt" -Encoding utf8
          "Commit: ${{ github.sha }}" | Out-File "$out\build-info.txt" -Append -Encoding utf8
          "Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File "$out\build-info.txt" -Append -Encoding utf8
          Get-ChildItem $out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: seewon-optimizer-exe
          path: artifact/
          retention-days: 90
          compression-level: 0    # exe 已是二进制，不再压缩
